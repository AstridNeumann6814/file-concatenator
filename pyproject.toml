[project]
name = "file-concatenator"
version = "0.1.0"
description = "Concatenates multiple files into one output stream without reading entire files into memory."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
